<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding HQ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean-deep:#4B5158; --reef:#838C93; --coral:#BFA179;
    --sand:#F1ECE3; --foam:#FFFDF9; --ink:#3D3A36; --ink-soft:#7C766D;
    --line:rgba(61,58,54,0.13);
    --bg:var(--sand); --surface:var(--foam); --surface-2:#EAE2D5;
    --text:var(--ink); --text-soft:var(--ink-soft);
    --accent:var(--reef); --accent-2:var(--coral); --border:var(--line);
    --shadow:0 1px 2px rgba(61,58,54,0.06), 0 8px 20px rgba(61,58,54,0.06);
    --shadow-lift:0 6px 16px rgba(61,58,54,0.10), 0 18px 44px rgba(61,58,54,0.10);
    --ok-bg:#DCEFE1; --ok-fg:#1F6B3C;
    --pend-bg:#FBE7D8; --pend-fg:#A85A22;
    --prog-bg:#E1EAF5; --prog-fg:#2C548C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#201F1D; --surface:#2B2926; --surface-2:#332F2A; --text:#F0EAE0; --text-soft:#C4BDB2;
      --accent:#A6ADB3; --accent-2:#D9BD91; --border:rgba(240,234,224,0.12);
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
      --shadow-lift:0 6px 16px rgba(0,0,0,0.32), 0 18px 44px rgba(0,0,0,0.4);
      --ok-bg:#173625; --ok-fg:#7FD8A0; --pend-bg:#3B2A19; --pend-fg:#F0AE73; --prog-bg:#1B2C43; --prog-fg:#9BC0F0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#201F1D; --surface:#2B2926; --surface-2:#332F2A; --text:#F0EAE0; --text-soft:#C4BDB2;
    --accent:#A6ADB3; --accent-2:#D9BD91; --border:rgba(240,234,224,0.12);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    --shadow-lift:0 6px 16px rgba(0,0,0,0.32), 0 18px 44px rgba(0,0,0,0.4);
    --ok-bg:#173625; --ok-fg:#7FD8A0; --pend-bg:#3B2A19; --pend-fg:#F0AE73; --prog-bg:#1B2C43; --prog-fg:#9BC0F0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif; line-height:1.5; }
  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0; }
  .wrap{max-width:1000px; margin:0 auto; padding:0 24px;}
  .mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}

  header{
    position:relative; overflow:hidden;
    background:linear-gradient(150deg, var(--ocean-deep) 0%, #3C4045 62%, #34383C 100%);
    color:#F6F1E7; padding:44px 0 68px;
  }
  header::before{
    content:""; position:absolute; top:-140px; right:-100px; width:420px; height:420px; border-radius:50%;
    background:radial-gradient(circle, rgba(191,161,121,0.16) 0%, transparent 70%);
    pointer-events:none;
  }
  header > .wrap{ position:relative; z-index:1; }
  header .brandmark{ font-family:'Fraunces', serif; font-style:italic; font-size:1.1rem; color:var(--accent-2); margin-bottom:2px; }
  header .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#C7B8A0; display:inline-flex; align-items:center; gap:9px; }
  header .eyebrow::before{ content:""; width:18px; height:1px; background:currentColor; opacity:0.55; }
  header h1{ font-size:clamp(1.9rem,4vw,2.6rem); color:#FBF7EE; font-weight:600; margin-top:10px; }
  .stat-row{ display:flex; flex-wrap:wrap; gap:12px; margin-top:26px; }
  .stat-row div{ background:rgba(246,241,231,0.07); border:1px solid rgba(246,241,231,0.14); border-radius:12px; padding:12px 20px; min-width:120px; }
  .stat-row .label{font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase; color:#C7B8A0; font-family:'IBM Plex Mono',monospace;}
  .stat-row .value{font-size:1.1rem; color:#FBF7EE; margin-top:4px; font-weight:600;}

  nav{
    display:flex; gap:3px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:6px; box-shadow:var(--shadow-lift);
    position:relative; margin-top:-26px; z-index:2;
  }
  nav button{ font-family:'Work Sans',sans-serif; font-size:0.86rem; font-weight:600; color:var(--text-soft); background:transparent; border:none; padding:10px 16px; cursor:pointer; border-radius:9px; transition:background 0.18s ease, color 0.18s ease; }
  nav button.active{ color:#FBF7EE; background:var(--ocean-deep); }
  nav button:not(.active):hover{ background:var(--surface-2); color:var(--text); }
  nav button:disabled{ opacity:0.4; cursor:not-allowed; }
  nav button:focus-visible{outline:2px solid var(--accent-2); outline-offset:1px;}

  main{padding:36px 0 80px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:15px; box-shadow:var(--shadow); padding:24px; }
  .card + .card{margin-top:16px;}
  .card h3{font-size:1.14rem; font-weight:600; margin-bottom:4px;}
  .card .sub{color:var(--text-soft); font-size:0.88rem; margin-bottom:16px;}
  .grid-3{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px;}

  table{width:100%; border-collapse:collapse; font-size:0.92rem;}
  thead th{ text-align:left; font-size:10.5px; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-soft); font-weight:600; padding:0 12px 10px; border-bottom:1px solid var(--border); }
  tbody td{padding:13px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background 0.15s ease;}
  tbody tr:hover td{background:var(--surface-2);}
  td.num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
  .table-wrap{overflow-x:auto; border-radius:4px;}

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:4px 11px; border-radius:99px; }
  .pill::before{ content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
  .pill.decided{background:var(--ok-bg); color:var(--ok-fg);}
  .pill.pending{background:var(--pend-bg); color:var(--pend-fg);}
  .pill.progress{background:var(--prog-bg); color:var(--prog-fg);}

  .kpi{ display:flex; flex-direction:column; gap:3px; }
  .kpi .num{font-size:2rem; font-weight:700; color:var(--accent); font-family:'Fraunces',serif;}
  .kpi .lbl{font-size:0.84rem; color:var(--text-soft);}

  .total-row td{font-weight:700; border-top:2px solid var(--border); border-bottom:none;}
  .note{ margin-top:16px; padding:14px 16px; background:var(--surface-2); border-left:3px solid var(--accent-2); border-radius:0 10px 10px 0; font-size:0.88rem; color:var(--text-soft); }
  .note strong{color:var(--text);}
  .contact-list{display:flex; flex-direction:column; gap:10px;}
  .contact{display:flex; justify-content:space-between; gap:12px; font-size:0.92rem;}
  .contact .role{color:var(--text-soft);}
  .flag{ display:flex; justify-content:space-between; padding:8px 0; font-size:0.9rem; border-bottom:1px solid var(--border); }
  .flag:last-child{border-bottom:none;}

  .task-list{ margin-top:14px; }
  .card h3 + .task-list{margin-top:0;}
  .task-list .task-item + .task-item{margin-top:9px;}
  .task-item{ display:block; position:relative; padding-left:26px; font-size:0.9rem; cursor:pointer; }
  .task-item input{ appearance:none; -webkit-appearance:none; width:16px; height:16px; border:1.5px solid var(--text-soft); border-radius:5px; position:absolute; left:0; top:2px; cursor:pointer; margin:0; transition:background 0.15s ease, border-color 0.15s ease; }
  .task-item input:checked{ background:var(--accent); border-color:var(--accent); }
  .task-item input:checked::after{ content:""; position:absolute; left:4px; top:0; width:5px; height:9px; border:solid white; border-width:0 2px 2px 0; transform:rotate(40deg); }
  .detail{ color:var(--text-soft); }

  /* Password gate */
  .gate{
    position:fixed; inset:0;
    background:radial-gradient(circle at 30% 20%, #565b61 0%, var(--ocean-deep) 55%, #2E3134 100%);
    display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:50;
  }
  .gate-box{
    background:var(--surface); border-radius:18px; padding:38px 36px;
    max-width:360px; width:100%; box-shadow:0 24px 70px rgba(0,0,0,0.4);
    text-align:center; border:1px solid rgba(255,255,255,0.08);
  }
  .gate-box .gate-mark{ font-family:'Fraunces',serif; font-style:italic; font-size:1.5rem; color:var(--accent-2); margin-bottom:10px; }
  .gate-box h2{font-size:1.28rem; margin-bottom:8px;}
  .gate-box p{color:var(--text-soft); font-size:0.88rem; margin:0 0 22px;}
  .gate-box input{
    width:100%; padding:12px 14px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:1rem; text-align:center;
    letter-spacing:0.05em;
  }
  .gate-box input:focus{outline:2px solid var(--accent); outline-offset:2px;}
  .gate-box button{
    margin-top:14px; width:100%; padding:12px; border:none; border-radius:9px;
    background:var(--accent); color:#0B1E24; font-weight:600; font-size:0.95rem; cursor:pointer;
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .gate-box button:hover{opacity:0.9;}
  .gate-box button:active{transform:scale(0.98);}
  .gate-error{ color:var(--accent-2); font-size:0.85rem; margin-top:10px; min-height:1.2em; }
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-mark">I &amp; A</div>
    <h2>Wedding HQ</h2>
    <p>Private planning dashboard. Enter the password to continue.</p>
    <input type="password" id="gate-password" autocomplete="off" placeholder="Password" autofocus>
    <button id="gate-submit">Unlock</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="brandmark">Irene &amp; Antzen</div>
    <div class="eyebrow">Private &middot; Planning Dashboard</div>
    <h1>Wedding HQ</h1>
    <div class="stat-row">
      <div><div class="label">Date</div><div class="value">Nov 26, 2027</div></div>
    </div>
  </div>
</header>

<div class="wrap">
  <nav id="tabs">
    <button data-panel="overview" class="active" disabled>Overview</button>
    <button data-panel="budget" disabled>Budget</button>
    <button data-panel="decisions" disabled>Vendors &amp; Decisions</button>
    <button data-panel="guests" disabled>Guests</button>
    <button data-panel="logistics" disabled>Logistics</button>
    <button data-panel="checklist" disabled>Checklist</button>
  </nav>
</div>

<main>
  <div class="wrap" id="main-content">
    <p style="color:var(--text-soft); font-size:0.9rem;">Enter the password above to load this page.</p>
  </div>
</main>

function b64ToBuf(b64){
  var bin = atob(b64);
  var buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

async function deriveKey(password){
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: b64ToBuf(ENC.salt), iterations: ENC.iterations, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
}

async function tryUnlock(password){
  try{
    var key = await deriveKey(password);
    var plainBuf = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv: b64ToBuf(ENC.iv)},
      key,
      b64ToBuf(ENC.ciphertext)
    );
    return new TextDecoder().decode(plainBuf);
  }catch(e){
    return null;
  }
}

function initTabs(){
  var buttons = document.querySelectorAll('#tabs button');
  buttons.forEach(function(btn){
    btn.disabled = false;
    btn.addEventListener('click', function(){
      buttons.forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      var target = document.getElementById('panel-' + btn.dataset.panel);
      if(target) target.classList.add('active');
    });
  });
}

(function(){
  var gate = document.getElementById('gate');
  var input = document.getElementById('gate-password');
  var submit = document.getElementById('gate-submit');
  var error = document.getElementById('gate-error');

  async function attempt(){
    submit.disabled = true;
    error.textContent = '';
    var html = await tryUnlock(input.value);
    submit.disabled = false;
    if(html === null){
      error.textContent = 'Incorrect password.';
      input.value = '';
      input.focus();
      return;
    }
    document.getElementById('main-content').innerHTML = html;
    initTabs();
    gate.remove();
  }

  submit.addEventListener('click', attempt);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') attempt(); });
})();
</script>
